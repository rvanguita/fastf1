name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uvx ruff@0.16.2 check .
      - run: uvx ruff@0.16.2 format --check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: root, dir: . }
          - { name: api, dir: app/api }
          - { name: streamlit, dir: app/streamlit }
    name: pytest (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv python install 3.13
      - name: pytest
        working-directory: ${{ matrix.dir }}
        run: uv run --locked pytest -q
