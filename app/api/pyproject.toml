[project]
name = "f1-api-driver-champion"
version = "0.1.0"
description = "F1 Driver Champion Predictor — FastAPI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "mlflow>=3.15.1",
    "numba>=0.61.0",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "psutil>=6.0.0",
    "rich>=13.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "shap>=0.48.0",
    "skops>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

# This project is a single-module service (main.py), not a distributable
# package — tell uv not to build/install it, only its dependencies.
[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
