[project]
name = "lake-fastf1"
version = "0.1.0"
description = "End-to-end Formula 1 data lakehouse with Spark, Airflow, MLflow, FastAPI and Streamlit"
readme = "README.md"
authors = [
    { name = "Rene", email = "renevajr@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "apache-airflow>=3.3.1",
    "boto3>=1.43.69",
    "delta-spark==3.3.2",
    "deltalake>=1.6.2",
    "fastf1>=3.8.3",
    "feature-engine>=1.9.4",
    "findspark>=2.0.1",
    "flask>=3.1.3",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.7.0",
    "mlflow>=3.15.1",
    "notebook>=7.0.0",
    "numpy>=1.24.0,<3.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0,<3.0.0",
    "pymysql>=1.2.0",
    "pyspark==3.5.7",
    "python-dotenv>=1.2.2",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "ruff>=0.16.2",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.61.1",
    "tabulate>=0.10.0",
]

[project.scripts]
lake-fastf1 = "lake_fastf1:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: needs Spark/Java, network or external services",
]
