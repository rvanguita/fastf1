services:
  airflow:
    user: "${AIRFLOW_UID:-50000}:0"
    build:
      context: .
      dockerfile: Dockerfile
    command: standalone
    ports:
      - "${AIRFLOW_PORT}:${AIRFLOW_PORT}"
    env_file:
      - ./.env
    environment:
      TZ: America/Sao_Paulo
      AIRFLOW_HOME: /opt/airflow/project/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    working_dir: /opt/airflow/project
    volumes:
      - ./:/opt/airflow/project
    restart: unless-stopped
  api-driver-champion:
    build:
      context: ./app/api/
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    env_file:
      ./.env
    restart:  unless-stopped
  streamlit:
    build:
      context: ./app/streamlit/
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      TABLE_PATH_SILVER: "/data/silver/tb_abt"
      TABLE_PATH_BRONZE: "/data/bronze/results"
      TABLE_PATH_MART_DRIVER_ROUND: "/data/silver/mart_driver_round"
      TABLE_PATH_MART_STANDINGS: "/data/silver/mart_standings"

    volumes:
      - ./data/silver/tb_abt:/data/silver/tb_abt:ro
      - ./data/bronze/results:/data/bronze/results:ro
    env_file:
      ./.env
    restart:  unless-stopped
    depends_on: 
      - "api-driver-champion"
      
